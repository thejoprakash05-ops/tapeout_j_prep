<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapeout — Course &amp; Interview Review</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2313294B'/%3E%3Ccircle cx='16' cy='9' r='2.6' fill='%23E84A27'/%3E%3Ccircle cx='9' cy='21' r='2.6' fill='%23E84A27'/%3E%3Ccircle cx='23' cy='21' r='2.6' fill='%23E84A27'/%3E%3Cline x1='14.3' y1='11' x2='10.4' y2='18.6' stroke='%23E84A27' stroke-width='1.8'/%3E%3Cline x1='17.7' y1='11' x2='21.6' y2='18.6' stroke='%23E84A27' stroke-width='1.8'/%3E%3C/svg%3E">
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --bg: #F3F6FB;
    --surface: #FFFFFF;
    --surface-2: #EAEFF7;
    --border: #DCE3EE;
    --nav-bg: #13294B;
    --nav-ink: #FFFFFF;
    --nav-muted: #9FB0CC;
    --ink: #13294B;
    --ink-soft: #34486A;
    --muted: #64748C;
    --accent: #E84A27;
    --accent-ink: #A6371C;
    --accent-soft: #FDE3D9;
    --accent-grad: linear-gradient(135deg, #F0602F, #E0431F);
    --good: #1E8E5A;
    --good-soft: #DEF3E8;
    --bad: #C0293D;
    --bad-soft: #FBE1E5;
    --radius-s: 8px;
    --radius: 14px;
    --radius-l: 20px;
    --shadow: 0 1px 2px rgba(19,41,75,0.06), 0 6px 18px rgba(19,41,75,0.06);
    --shadow-hover: 0 2px 4px rgba(19,41,75,0.08), 0 10px 26px rgba(19,41,75,0.1);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1626;
      --surface: #16294A;
      --surface-2: #1E3563;
      --border: #2E4A78;
      --nav-bg: #0D1E38;
      --nav-ink: #FFFFFF;
      --nav-muted: #8FA0BC;
      --ink: #EEF3FB;
      --ink-soft: #C9D6EA;
      --muted: #90A2C0;
      --accent: #FF8659;
      --accent-ink: #FFB08C;
      --accent-soft: rgba(255,134,89,0.18);
      --accent-grad: linear-gradient(135deg, #FF8659, #E8592F);
      --good: #4FD79B;
      --good-soft: rgba(79,215,155,0.16);
      --bad: #FF6B7A;
      --bad-soft: rgba(255,107,122,0.16);
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-hover: 0 6px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1626;
    --surface: #16294A;
    --surface-2: #1E3563;
    --border: #2E4A78;
    --nav-bg: #0D1E38;
    --nav-ink: #FFFFFF;
    --nav-muted: #8FA0BC;
    --ink: #EEF3FB;
    --ink-soft: #C9D6EA;
    --muted: #90A2C0;
    --accent: #FF8659;
    --accent-ink: #FFB08C;
    --accent-soft: rgba(255,134,89,0.18);
    --accent-grad: linear-gradient(135deg, #FF8659, #E8592F);
    --good: #4FD79B;
    --good-soft: rgba(79,215,155,0.16);
    --bad: #FF6B7A;
    --bad-soft: rgba(255,107,122,0.16);
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-hover: 0 6px 20px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    min-height: 100vh;
  }
  ::selection { background: var(--accent-soft); color: var(--ink); }
  a { color: inherit; text-decoration: none; }
  button, input { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; }

  h1, h2, h3, .disp {
    font-family: var(--font-sans);
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .eyebrow {
    font-family: var(--font-sans);
    font-size: 11.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--accent-ink);
    background: var(--accent-soft);
    display: inline-block;
    padding: 5px 11px;
    border-radius: 999px;
  }

  .shell {
    display: grid;
    grid-template-columns: 250px 1fr;
    min-height: 100vh;
    max-width: 1220px;
    margin: 0 auto;
  }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .navrail { position: static; height: auto; }
  }

  /* ---------- Nav rail ---------- */
  .navrail {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    background: var(--nav-bg);
    color: var(--nav-ink);
    padding: 24px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 6px; }
  .brand-badge {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--accent-grad);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(232,74,39,0.35);
  }
  .brand-badge svg { width: 19px; height: 19px; stroke: white; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-name { font-family: var(--font-sans); font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
  .brand-tag { font-size: 11px; color: var(--nav-muted); margin-top: 2px; }

  nav.navlist { display: flex; flex-direction: column; gap: 3px; }
  .nav-group-label {
    font-family: var(--font-sans);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--nav-muted);
    padding: 14px 10px 5px;
  }
  .navlink {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 11px;
    cursor: pointer;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    color: var(--nav-ink);
  }
  .navlink:hover { background: rgba(255,255,255,0.08); }
  .navlink.active { background: var(--accent-grad); box-shadow: 0 3px 10px rgba(232,74,39,0.3); }
  .navlink .nicon { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; opacity: 0.92; }
  .navlink-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .navlink-name { font-family: var(--font-sans); font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .navlink-sub { font-size: 10.5px; color: var(--nav-muted); }
  .navlink.active .navlink-sub { color: rgba(255,255,255,0.85); }
  .navbadge {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .navlink.active .navbadge { background: rgba(255,255,255,0.22); }

  .navrail-footer {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.12);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .reset-btn {
    background: none;
    border: none;
    color: var(--nav-muted);
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    padding: 6px 8px;
  }
  .reset-btn:hover { color: #FF9E85; }

  /* ---------- Main ---------- */
  main { padding: 34px 40px 90px; min-width: 0; }
  @media (max-width: 640px) { main { padding: 22px 16px 70px; } }

  .section-head {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-l);
    padding: 26px 28px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .section-head-icon {
    width: 56px; height: 56px; border-radius: 16px;
    background: var(--accent-grad);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 6px 16px rgba(232,74,39,0.3);
  }
  .section-head-icon svg { width: 30px; height: 30px; stroke: white; }
  .section-head-text h1 { font-size: 26px; margin: 6px 0 6px; line-height: 1.15; }
  .section-head-text .blurb { font-size: 14.5px; line-height: 1.55; color: var(--ink-soft); margin: 0; max-width: 58ch; }

  .keyideas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
    margin-bottom: 26px;
  }
  .keyidea {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 15px;
    border-left: 3px solid var(--accent);
    box-shadow: var(--shadow);
  }
  .keyidea .topic {
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 5px;
    display: block;
  }
  .keyidea p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }

  .qlist { display: flex; flex-direction: column; gap: 14px; }
  .qcard {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-l);
    padding: 20px 22px 22px;
    box-shadow: var(--shadow);
  }
  .qcard[data-state="correct"] { box-shadow: var(--shadow), inset 3px 0 0 var(--good); }
  .qcard[data-state="incorrect"] { box-shadow: var(--shadow), inset 3px 0 0 var(--bad); }

  .qmeta { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .qnum {
    width: 28px; height: 28px; border-radius: 999px;
    background: var(--surface-2);
    color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .qcard[data-state] .qnum { background: var(--accent-grad); color: white; }
  .qtopic {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-ink);
    background: var(--accent-soft);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .qstatus {
    margin-left: auto;
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 800;
    display: none;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .qcard[data-state="correct"] .qstatus { display: inline-flex; color: var(--good); background: var(--good-soft); }
  .qcard[data-state="incorrect"] .qstatus { display: inline-flex; color: var(--bad); background: var(--bad-soft); }

  .qprompt { font-size: 15.5px; line-height: 1.6; margin: 0 0 15px; font-weight: 500; }
  .qprompt code {
    font-family: var(--font-mono);
    font-size: 0.88em;
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 4px;
  }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    line-height: 1.5;
    font-family: var(--font-sans);
    font-weight: 500;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt .optdot {
    width: 20px; height: 20px; border-radius: 999px;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .opt .optdot::after { content: ""; width: 9px; height: 9px; border-radius: 999px; background: transparent; }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--good); background: var(--good-soft); }
  .opt.correct .optdot { border-color: var(--good); }
  .opt.correct .optdot::after { background: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .optdot { border-color: var(--bad); }
  .opt.wrong .optdot::after { background: var(--bad); }

  .short-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent-grad); color: white; border-color: transparent; box-shadow: 0 4px 12px rgba(232,74,39,0.28); }
  .btn.primary:hover { opacity: 0.92; border-color: transparent; }
  .btn.good { border-color: var(--good); color: var(--good); }
  .btn.good:hover { background: var(--good-soft); }
  .btn.bad { border-color: var(--bad); color: var(--bad); }
  .btn.bad:hover { background: var(--bad-soft); }

  .answer-box {
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--surface-2);
    border-radius: var(--radius);
    display: none;
  }
  .answer-box.show { display: block; }
  .answer-box .ans-label {
    font-family: var(--font-sans);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--accent-ink);
    display: block;
    margin-bottom: 6px;
  }
  .answer-box .ans-text { font-size: 14.5px; margin: 0 0 5px; font-weight: 700; }
  .answer-box .explain { font-size: 13.5px; line-height: 1.55; color: var(--muted); margin: 0; }

  .explain-block { margin-top: 12px; padding: 13px 15px; background: var(--surface-2); border-radius: var(--radius); font-size: 13.5px; line-height: 1.55; color: var(--muted); display: none; }
  .explain-block.show { display: block; }
  .explain-block p { margin: 0; }

  /* ---------- Home ---------- */
  .hero {
    background: var(--nav-bg);
    color: white;
    border-radius: var(--radius-l);
    padding: 30px 32px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    box-shadow: var(--shadow);
  }
  .hero h1 { color: white; font-size: 28px; margin: 8px 0 8px; }
  .hero p { color: var(--nav-muted); font-size: 14px; margin: 0; max-width: 48ch; line-height: 1.55; }
  .hero .eyebrow { background: rgba(255,255,255,0.14); color: white; }
  .hero-ring { flex-shrink: 0; }

  .home-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .home-card {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-l);
    padding: 20px 20px 18px;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .home-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .home-card-top { display: flex; align-items: center; gap: 12px; }
  .home-card-icon {
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .home-card-icon svg { width: 22px; height: 22px; stroke: var(--accent-ink); }
  .home-card .hc-code { font-family: var(--font-sans); font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .home-card .hc-name { font-size: 16.5px; font-weight: 800; margin: 1px 0 0; font-family: var(--font-sans); }
  .home-card .hc-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 0; }
  .home-card-bottom { display: flex; align-items: center; gap: 10px; margin-top: auto; }
  .ring-wrap { position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ring-wrap .ring-pct { position: absolute; font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
  .hc-stat { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }

  /* ---------- Interview groups ---------- */
  .group-title { font-size: 19px; margin: 30px 0 6px; }
  .group-sub { font-size: 13.5px; color: var(--muted); margin: 0 0 16px; max-width: 60ch; line-height: 1.55; }
  .prompt-list { display: flex; flex-direction: column; gap: 10px; }
  .prompt-card {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius);
    padding: 15px 17px;
    box-shadow: var(--shadow);
  }
  .prompt-card .pq { font-size: 14.5px; font-weight: 700; margin: 0 0 6px; font-family: var(--font-sans); }
  .prompt-card .ptip { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; }
  .checklist { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .checklist li {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    font-size: 13.5px;
    line-height: 1.55;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .checklist li .mark {
    width: 20px; height: 20px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-ink);
    font-family: var(--font-mono); font-size: 11px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .navlink, .opt, .btn, .home-card { transition: background-color 120ms ease, border-color 120ms ease, box-shadow 160ms ease, transform 160ms ease; }
  }
  @media (prefers-reduced-motion: reduce) {
    .home-card:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="navrail">
    <div class="brand">
      <div class="brand-badge"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 L12 4 L20 11"/><path d="M6 10 V20 H18 V10"/></svg></div>
      <div class="brand-text">
        <span class="brand-name">Tapeout</span>
        <span class="brand-tag">Final checks before you ship</span>
      </div>
    </div>
    <nav class="navlist" id="navlist"></nav>
    <div class="navrail-footer">
      <span class="navlink-sub mono" id="overallEyebrow" style="padding:0 10px;">0 / 0 reviewed</span>
      <button class="reset-btn" id="resetBtn">Reset all progress</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>

  // ---------------- State ----------------
  function loadProgress() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveProgress(state) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  var progress = loadProgress();

  function setStatus(key, status) {
    progress[key] = status;
    saveProgress(progress);
    renderSidebar();
  }

  function allSections() { return SECTIONS.concat([INTERVIEW]); }

  function sectionQuestionIds(section) {
    var ids = [];
    if (section.questions) section.questions.forEach(function (q) { ids.push(section.id + "-" + q.id); });
    if (section.technical) section.technical.forEach(function (q) { ids.push(section.id + "-t" + q.id); });
    return ids;
  }
  function sectionStats(section) {
    var ids = sectionQuestionIds(section);
    var correct = 0, answered = 0;
    ids.forEach(function (k) {
      if (progress[k] === "correct") { correct++; answered++; }
      else if (progress[k] === "incorrect") { answered++; }
    });
    return { total: ids.length, answered: answered, correct: correct };
  }

  // ---------------- Sidebar ----------------
  var navlist = document.getElementById("navlist");
  var overallEyebrow = document.getElementById("overallEyebrow");

  function renderSidebar() {
    var hash = location.hash.replace("#/", "") || "home";
    navlist.innerHTML = "";

    navlist.appendChild(makeNavlink("home", "home", "Home", "Overview", null, hash === "home"));

    var groupLabel = document.createElement("div");
    groupLabel.className = "nav-group-label";
    groupLabel.textContent = "Coursework";
    navlist.appendChild(groupLabel);

    var totalAll = 0, correctAll = 0;
    SECTIONS.forEach(function (s) {
      var stats = sectionStats(s);
      totalAll += stats.total; correctAll += stats.correct;
      navlist.appendChild(makeNavlink(s.id, s.icon, s.code, s.name, stats, hash === s.id));
    });

    var groupLabel2 = document.createElement("div");
    groupLabel2.className = "nav-group-label";
    groupLabel2.textContent = "Beyond coursework";
    navlist.appendChild(groupLabel2);

    var iStats = sectionStats(INTERVIEW);
    totalAll += iStats.total; correctAll += iStats.correct;
    navlist.appendChild(makeNavlink(INTERVIEW.id, INTERVIEW.icon, INTERVIEW.code, INTERVIEW.name, iStats, hash === INTERVIEW.id));

    overallEyebrow.textContent = correctAll + " / " + totalAll + " reviewed";
  }

  function makeNavlink(id, icon, code, name, stats, active) {
    var a = document.createElement("a");
    a.href = "#/" + id;
    a.className = "navlink" + (active ? " active" : "");
    var html = iconSvg(icon, "nicon") +
      '<span class="navlink-text"><span class="navlink-name">' + code + '</span><span class="navlink-sub">' + name + '</span></span>';
    if (stats) html += '<span class="navbadge mono">' + stats.correct + '/' + stats.total + '</span>';
    a.innerHTML = html;
    return a;
  }

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (confirm("Reset all saved progress? This clears every answered question.")) {
      progress = {};
      saveProgress(progress);
      renderSidebar();
      route();
    }
  });

  // ---------------- Rendering: questions ----------------
  function renderQuestionCard(q, sectionId, keySuffix) {
    var key = sectionId + "-" + (keySuffix || q.id);
    var state = progress[key];
    var card = document.createElement("div");
    card.className = "qcard";
    if (state) card.setAttribute("data-state", state);

    var meta = document.createElement("div");
    meta.className = "qmeta";
    meta.innerHTML =
      '<span class="qnum mono">' + String(q.id).padStart(2, "0") + '</span>' +
      '<span class="qtopic">' + q.topic + '</span>' +
      '<span class="qstatus">' + (state === "correct" ? "✓ Correct" : state === "incorrect" ? "✗ Missed" : "") + '</span>';
    card.appendChild(meta);

    var prompt = document.createElement("p");
    prompt.className = "qprompt";
    prompt.textContent = q.prompt;
    card.appendChild(prompt);

    if (q.type === "mcq") {
      var opts = document.createElement("div");
      opts.className = "options";
      q.options.forEach(function (optText, idx) {
        var btn = document.createElement("button");
        btn.className = "opt";
        btn.innerHTML = '<span class="optdot"></span><span>' + optText + '</span>';
        if (state) {
          btn.disabled = true;
          if (idx === q.answer) btn.classList.add("correct");
          else if (progress[key + "-picked"] == idx) btn.classList.add("wrong");
        }
        btn.addEventListener("click", function () {
          var correct = idx === q.answer;
          progress[key + "-picked"] = idx;
          setStatus(key, correct ? "correct" : "incorrect");
          rerenderCurrent();
        });
        opts.appendChild(btn);
      });
      card.appendChild(opts);

      var explain = document.createElement("div");

        row.appendChild(revealBtn);
        row.appendChild(gotBtn);
        row.appendChild(missBtn);
      } else {
        var again = document.createElement("button");
        again.className = "btn";
        again.textContent = state === "correct" ? "Mark as missed instead" : "Mark as had-it instead";
        again.addEventListener("click", function () {
          setStatus(key, state === "correct" ? "incorrect" : "correct");
          rerenderCurrent();
        });
        row.appendChild(again);
      }

      card.appendChild(row);
      card.appendChild(answerBox);
    }

    return card;
  }

  // ---------------- Rendering: course section ----------------
  function renderCourseSection(section) {
    var main = document.getElementById("main");
    main.innerHTML = "";

    var head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML =
      '<div class="section-head-icon">' + iconSvg(section.icon) + '</div>' +
      '<div class="section-head-text">' +
        '<span class="eyebrow">Course review · ' + section.code + '</span>' +
        '<h1>' + section.name + '</h1>' +
        '<p class="blurb">' + section.blurb + '</p>' +
      '</div>';
    main.appendChild(head);

    var ki = document.createElement("div");
    ki.className = "keyideas";
    section.topics.forEach(function (t) {
      var div = document.createElement("div");
      div.className = "keyidea";
      div.innerHTML = '<span class="topic">' + t[0] + '</span><p>' + t[1] + '</p>';
      ki.appendChild(div);
    });
    main.appendChild(ki);

    var qlist = document.createElement("div");
    qlist.className = "qlist";
    section.questions.forEach(function (q) {
      qlist.appendChild(renderQuestionCard(q, section.id));
    });
    main.appendChild(qlist);
  }

  // ---------------- Rendering: interview ----------------
  function renderInterview() {
    var main = document.getElementById("main");
    main.innerHTML = "";

    var head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML =
      '<div class="section-head-icon">' + iconSvg(INTERVIEW.icon) + '</div>' +
      '<div class="section-head-text">' +
        '<span class="eyebrow">' + INTERVIEW.code + '</span>' +
        '<h1>' + INTERVIEW.name + '</h1>' +
        '<p class="blurb">' + INTERVIEW.blurb + '</p>' +
      '</div>';
    main.appendChild(head);

    var g1 = document.createElement("h2");
    g1.className = "group-title";
    g1.textContent = "Behavioral prompts";
    var g1s = document.createElement("p");
    g1s.className = "group-sub";
    g1s.textContent = "No auto-grading here — these are prompts to rehearse out loud. Structure answers with STAR: Situation, Task, Action, Result.";
    main.appendChild(g1); main.appendChild(g1s);

    var plist = document.createElement("div");
    plist.className = "prompt-list";
    INTERVIEW.behavioral.forEach(function (b) {
      var c = document.createElement("div");
      c.className = "prompt-card";
      c.innerHTML = '<p class="pq">' + b.q + '</p><p class="ptip">' + b.tip + '</p>';
      plist.appendChild(c);
    });
    main.appendChild(plist);

    var g2 = document.createElement("h2");
    g2.className = "group-title";
    g2.textContent = "Technical patterns";
    var g2s = document.createElement("p");
    g2s.className = "group-sub";
    g2s.textContent = "The recurring patterns behind most DSA-style OA and interview questions.";
    main.appendChild(g2); main.appendChild(g2s);

    var qlist = document.createElement("div");
    qlist.className = "qlist";
    INTERVIEW.technical.forEach(function (q) {
      qlist.appendChild(renderQuestionCard(q, INTERVIEW.id, "t" + q.id));
    });
    main.appendChild(qlist);

    var g3 = document.createElement("h2");
    g3.className = "group-title";
    g3.textContent = "System design basics";
    var g3s = document.createElement("p");
    g3s.className = "group-sub";
    g3s.textContent = "New-grad-level system design rarely goes deep — it checks that you know the basic vocabulary.";
    main.appendChild(g3); main.appendChild(g3s);

    var plist2 = document.createElement("div");
    plist2.className = "prompt-list";
    INTERVIEW.systemDesign.forEach(function (b) {
      var c = document.createElement("div");
      c.className = "prompt-card";
      c.innerHTML = '<p class="pq">' + b.q + '</p><p class="ptip">' + b.tip + '</p>';
      plist2.appendChild(c);
    });
    main.appendChild(plist2);

    var g4 = document.createElement("h2");
    g4.className = "group-title";
    g4.textContent = "Online assessment checklist";
    var g4s = document.createElement("p");
    g4s.className = "group-sub";
    g4s.textContent = "Run through this before you click \"start\" on a timed OA.";
    main.appendChild(g4); main.appendChild(g4s);

    var ul = document.createElement("ul");
    ul.className = "checklist";
    INTERVIEW.checklist.forEach(function (item, i) {
      var li = document.createElement("li");
      li.innerHTML = '<span class="mark mono">' + (i + 1) + '</span><span>' + item + '</span>';
      ul.appendChild(li);
    });
    main.appendChild(ul);
  }

  // ---------------- Rendering: home ----------------
  function renderHome() {
    var main = document.getElementById("main");
    main.innerHTML = "";

    var all = allSections();
    var totalAll = 0, correctAll = 0;
    all.forEach(function (s) { var st = sectionStats(s); totalAll += st.total; correctAll += st.correct; });
    var pct = totalAll ? Math.round((correctAll / totalAll) * 100) : 0;

    var hero = document.createElement("div");
    hero.className = "hero";
    hero.innerHTML =
      '<div>' +
        '<span class="eyebrow">Review hub</span>' +
        '<h1>Everything before it ships.</h1>' +
        '<p>Course review for CS 225, ECE 391, ECE 385, Applied ML, and Robotics, plus a dedicated pass for interviews and OAs. Progress saves in this browser as you go.</p>' +
      '</div>' +
      '<div class="hero-ring"><div class="ring-wrap">' + ringSvg(pct, 88, 9) +
        '<span class="ring-pct" style="color:white;font-size:17px;">' + pct + '%</span></div></div>';
    main.appendChild(hero);

    var grid = document.createElement("div");
    grid.className = "home-grid";
    all.forEach(function (s) {
      var stats = sectionStats(s);
      var pct2 = stats.total ? Math.round((stats.correct / stats.total) * 100) : 0;
      var card = document.createElement("a");
      card.href = "#/" + s.id;
      card.className = "home-card";
      card.innerHTML =
        '<div class="home-card-top">' +
          '<div class="home-card-icon">' + iconSvg(s.icon) + '</div>' +
          '<div><div class="hc-code">' + s.code + '</div><p class="hc-name">' + s.name + '</p></div>' +
        '</div>' +
        '<p class="hc-desc">' + s.blurb + '</p>' +
        '<div class="home-card-bottom">' +
          '<div class="ring-wrap">' + ringSvg(pct2, 40, 4) + '<span class="ring-pct" style="color:var(--ink);font-size:10px;">' + pct2 + '%</span></div>' +
          '<span class="hc-stat">' + stats.correct + ' / ' + stats.total + ' correct</span>' +
        '</div>';
      grid.appendChild(card);
    });
    main.appendChild(grid);
  }

  // ---------------- Router ----------------
  function route() {
    var hash = location.hash.replace("#/", "") || "home";
    if (hash === "home") {
      renderHome();
    } else if (hash === INTERVIEW.id) {
      renderInterview();
    } else {
      var section = SECTIONS.filter(function (s) { return s.id === hash; })[0];
      if (section) renderCourseSection(section);
      else renderHome();
    }
    renderSidebar();
    window.scrollTo(0, 0);
  }
  function rerenderCurrent() { route(); }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
